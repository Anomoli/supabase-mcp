# VP-2 self-hosted LiveKit server config (sovereign: Apache-2.0, runs on Gammy).
# Used by livekit/docker-compose.yml. Credentials come from the gitignored
# livekit/.env generated by scripts/configure_livekit.py.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50060
  # Phone on the same Wi-Fi finds the server via the LAN IP; no STUN/TURN
  # cloud dependency for LAN-only use.
  use_external_ip: false
logging:
  level: info
